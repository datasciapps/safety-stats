<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generative Safety Evaluation</title>
<style>
:root {
  --bg: #ffffff; --fg: #1a1d21; --muted: #5c6470; --line: #dfe3e8;
  --panel: #f7f8fa; --accent: #1f5fa9; --warn: #8a6100; --warn-bg: #fdf6e3;
  --err: #a02020; --err-bg: #fdeeee; --ok: #1f7a4d; --bar: #c3d4e8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c; --fg: #e6e8eb; --muted: #98a0ab; --line: #2c3038;
    --panel: #1d2026; --accent: #6ea8e8; --warn: #d9a441; --warn-bg: #2a2417;
    --err: #e58b8b; --err-bg: #2b1a1a; --ok: #5fc08c; --bar: #2f4661;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 2rem 1.5rem 4rem; background: var(--bg); color: var(--fg);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { max-width: 1080px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
h2 { font-size: 1.05rem; margin: 2.25rem 0 .75rem; padding-bottom: .35rem;
     border-bottom: 1px solid var(--line); font-weight: 600; }
p { margin: .5rem 0; }
.sub { color: var(--muted); margin: 0 0 1rem; }
.estimand {
  background: var(--panel); border-left: 3px solid var(--accent); padding: .75rem 1rem;
  margin: 1rem 0 1.5rem; color: var(--muted); font-size: .92rem;
}
.badge {
  display: inline-block; padding: .1rem .5rem; border-radius: 3px; font-size: .78rem;
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  margin-left: .4rem; vertical-align: middle;
}
.grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: .8rem 1rem; }
.card .label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.card .value { font-size: 1.5rem; font-weight: 600; margin-top: .2rem; font-variant-numeric: tabular-nums; }
.card .note { color: var(--muted); font-size: .8rem; margin-top: .15rem; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: .4rem .55rem; border-bottom: 1px solid var(--line);
         overflow-wrap: anywhere; }
th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; }
dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; margin: 0; font-size: .86rem; }
dl.meta dt { color: var(--muted); }
dl.meta dd { margin: 0; word-break: break-all; }
.tree { font-size: .87rem; }
.tree details { margin-left: .9rem; border-left: 1px solid var(--line); padding-left: .7rem; }
.tree > details { margin-left: 0; border-left: none; padding-left: 0; }
.tree summary { cursor: pointer; padding: .18rem 0; }
.tree summary::marker { color: var(--muted); }
.row { display: grid; grid-template-columns: 1fr 5rem 4.5rem 5rem 6rem; gap: .5rem; align-items: center; }
.row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.row .b { text-align: right; font-variant-numeric: tabular-nums; }
.leaf { padding: .18rem 0 .18rem 1.1rem; }
.unsampled { color: var(--muted); font-style: italic; }
.bar { height: 4px; background: var(--bar); border-radius: 2px; margin-top: 2px; }
.diag { border-left: 3px solid var(--line); padding: .5rem .75rem; margin: .4rem 0; background: var(--panel); }
.diag.ERROR { border-color: var(--err); background: var(--err-bg); color: var(--err); }
.diag.WARNING { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.diag .code { font-weight: 600; font-size: .8rem; }
.empty { color: var(--muted); font-style: italic; }
footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem; }
</style>
</head>
<body>
<main id="root"></main>
<script id="generative-report-data" type="application/json">__INSPECT_SAFETY_STATS_GENERATIVE_DATA__</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("generative-report-data").textContent);
  var root = document.getElementById("root");

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (key) {
      if (key === "class") node.className = attrs[key];
      else if (key === "text") node.textContent = attrs[key];
      else node.setAttribute(key, attrs[key]);
    });
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }
  function pct(value, places) {
    if (value === null || value === undefined) return "—";
    return (value * 100).toFixed(places === undefined ? 2 : places) + "%";
  }
  function signed(value) {
    if (value === null || value === undefined) return "—";
    return (value >= 0 ? "+" : "") + (value * 100).toFixed(2) + "%";
  }
  function section(title) { return el("h2", { text: title }); }
  function card(label, value, note) {
    return el("div", { class: "card" }, [
      el("div", { class: "label", text: label }),
      el("div", { class: "value", text: value }),
      note ? el("div", { class: "note", text: note }) : null
    ]);
  }
  function table(headers, rows) {
    var head = el("tr", null, headers.map(function (h) {
      return el("th", { class: h.num ? "num" : "", text: h.label });
    }));
    var body = rows.map(function (row) {
      return el("tr", null, row.map(function (cell, index) {
        return el("td", { class: headers[index].num ? "num" : "", text: cell });
      }));
    });
    return el("div", { class: "scroll" }, [
      el("table", null, [el("thead", null, [head]), el("tbody", null, body)])
    ]);
  }

  // ---- header -------------------------------------------------------------
  var evaluation = data.evaluation || {};
  root.appendChild(el("h1", null, [
    document.createTextNode(evaluation.title || "Generative safety evaluation"),
    el("span", { class: "badge", text: evaluation.intent || "" })
  ]));
  root.appendChild(el("p", { class: "sub", text: evaluation.id || "" }));
  root.appendChild(el("div", { class: "estimand", text: data.estimand || "" }));

  // ---- root estimate ------------------------------------------------------
  var rootNode = data.root || {};
  var coverage = data.coverage || {};
  var level = Math.round((1 - (coverage.alpha || 0)) * 100);
  var bound = coverage.mode === "one_sided_upper" ? level + "% upper bound" : level + "% interval";
  root.appendChild(section("Root risk"));
  root.appendChild(el("div", { class: "grid" }, [
    card(bound, pct(rootNode.upper, 3), rootNode.method),
    card("Design-weighted estimate", pct(rootNode.estimate, 3),
         "raw sampled rate " + pct(rootNode.raw_failure_rate, 3)),
    card("Draws", String(rootNode.draws === undefined ? "—" : rootNode.draws),
         rootNode.failures + " failures, " + rootNode.unclassified + " unclassified"),
    card("Effective sample size",
         rootNode.effective_sample_size === undefined || rootNode.effective_sample_size === null
           ? "—" : rootNode.effective_sample_size.toFixed(1),
         "weight geometry, not information"),
    coverage.mode === "two_sided"
      ? card("Lower bound", pct(rootNode.lower, 3), null)
      : card("Coefficients", rootNode.equal_coefficients ? "equal" : "unequal",
             rootNode.equal_coefficients ? "sharp kernel retained"
               : "ratio " + (rootNode.coefficient_ratio || 0).toFixed(4))
  ]));

  // ---- design -------------------------------------------------------------
  var design = data.design || {};
  root.appendChild(section("Design"));
  root.appendChild(el("div", { class: "grid" }, [
    card("Sampling", design.method || "—", design.total_rewrites + " rewrites"),
    card("Frame", String(design.terminal_paths), "terminal structural paths"),
    card("Strata", design.strata ? String(design.strata) : "—",
         design.strata ? "proportional allocation" : "no stratification"),
    card("Unsampled nodes", String((data.unsampled_nodes || []).length),
         "no draw landed there")
  ]));
  var allocation = design.allocation || [];
  if (allocation.length) {
    root.appendChild(table(
      [{ label: "Stratum" }, { label: "Target weight", num: true },
       { label: "Draws", num: true }, { label: "Draws if exactly proportional", num: true }],
      allocation.map(function (item) {
        var proportional = item.stratum_weight * design.total_rewrites;
        return [item.stratum_id, pct(item.stratum_weight, 2), String(item.draws),
                proportional.toFixed(1)];
      })
    ));
    root.appendChild(el("p", { class: "sub", text:
      "Where the realized draws depart from the proportional column, the estimator's " +
      "coefficients are unequal and the sharp kernel is unavailable." }));
  }

  // ---- comparisons --------------------------------------------------------
  var comparisons = data.comparisons || [];
  if (comparisons.length) {
    root.appendChild(section("Cohort comparisons"));
    root.appendChild(table(
      [{ label: "Candidate − baseline" }, { label: "Node" },
       { label: "Estimate", num: true }, { label: "Upper", num: true },
       { label: "Candidate", num: true }, { label: "Baseline", num: true },
       { label: "Discordant", num: true }, { label: "Method" }],
      comparisons.map(function (item) {
        var discordant = item.discordant_candidate_only === null ||
          item.discordant_candidate_only === undefined
          ? "—"
          : item.discordant_candidate_only + " / " + item.discordant_baseline_only;
        return [
          item.candidate_cohort + " − " + item.baseline_cohort,
          item.node_id,
          signed(item.estimate),
          signed(item.upper),
          pct((item.candidate || {}).estimate),
          pct((item.baseline || {}).estimate),
          discordant,
          item.method
        ];
      })
    ));
    root.appendChild(el("p", { class: "sub", text:
      "A concordant unit contributes exactly zero to the difference, so the bound reads only " +
      "the units where the arms disagreed. Comparisons are pointwise and are not part of the " +
      "tree's simultaneous family." }));
  }

  // ---- slices -------------------------------------------------------------
  var slices = data.slices || [];
  if (slices.length) {
    root.appendChild(section("Cross-cutting slices"));
    root.appendChild(table(
      [{ label: "Slice" }, { label: "Weight", num: true }, { label: "Draws", num: true },
       { label: "ESS", num: true }, { label: "Estimate", num: true },
       { label: "Upper", num: true }, { label: "Method" }],
      slices.map(function (item) {
        var ess = item.effective_sample_size;
        return [item.node_id.replace(/^slice:/, ""), pct(item.node_weight, 1),
                String(item.draws), ess === undefined || ess === null ? "—" : ess.toFixed(1),
                pct(item.estimate), pct(item.upper), item.method];
      })
    ));
    root.appendChild(el("p", { class: "sub", text:
      "A slice spans terminal paths that do not form a subtree. It overlaps the tree's nodes, " +
      "so it is reported pointwise." }));
  }

  // ---- declared slice family ---------------------------------------------
  var family = data.slice_family;
  if (family && ((family.slices || []).length || (family.contrasts || []).length)) {
    root.appendChild(section("Declared slice family (experimental)"));
    var familyRows = (family.slices || []).map(function (item) {
      return [item.member_id, "slice", String(item.arm.draws), pct(item.arm.estimate),
              family.coverage_mode === "two_sided" ? pct(item.arm.lower) : "—",
              pct(item.arm.upper), item.frontier_id, item.arm.method];
    }).concat((family.contrasts || []).map(function (item) {
      return [item.id + ": " + item.candidate_value + " − " + item.baseline_value,
              "contrast on " + item.shared_seeds + " seeds",
              String(item.candidate.draws + item.baseline.draws), signed(item.estimate),
              family.coverage_mode === "two_sided" ? signed(item.lower) : "—",
              signed(item.upper), item.frontier_id,
              item.candidate.method + " / " + item.baseline.method];
    }));
    root.appendChild(table(
      [{ label: "Member" }, { label: "Kind" }, { label: "Draws", num: true },
       { label: "Estimate", num: true }, { label: "Lower", num: true },
       { label: "Upper", num: true }, { label: "Frontier" }, { label: "Method" }],
      familyRows
    ));
    root.appendChild(el("p", { class: "sub", text:
      "Every member is covered simultaneously at " + pct(1 - family.alpha, 0) +
      (family.coverage_mode === "two_sided" ? ", both bounds together" : "") + ". A contrast " +
      "compares two values of one level on the seeds that hold both, with the seed mix held " +
      "fixed. Members stay on the judge-reported scale." }));
  }

  // ---- judge correction ---------------------------------------------------
  var corrected = data.corrected || [];
  if (corrected.length) {
    var judge = (data.evaluation || {}).judge_calibration || {};
    root.appendChild(section("Judge misclassification"));
    root.appendChild(el("p", { class: "sub", text:
      judge.mode === "validated"
        ? "Measured from human labels, which weight every classified unit of the cohort " +
          "equally. Only a root that does the same is certifying, at the union of the " +
          "interval's budget, the calibration's and that of the bound on the unclassified " +
          "share; nodes and slices are sensitivity results."
        : "Declared, not measured. These are sensitivity results and carry no evidence: " +
          "they cannot support a claim." }));
    if (judge.rho_1) {
      root.appendChild(el("p", { class: "sub mono", text:
        "rho_1 " + judge.rho_1.map(function (v) { return pct(v); }).join(" to ") +
        ",  rho_0 " + judge.rho_0.map(function (v) { return pct(v); }).join(" to ") }));
    }
    var shown = corrected.filter(function (item) {
      return item.node_id === "all" || item.node_id.indexOf("slice:") === 0;
    });
    root.appendChild(table(
      [{ label: "Target" }, { label: "Scenario" },
       { label: "Judge-reported", num: true }, { label: "True risk", num: true },
       { label: "Corrected estimate", num: true }, { label: "Eligibility" }],
      shown.map(function (item) {
        return [
          item.node_id.replace(/^slice:/, ""),
          item.scenario_id,
          pct(item.observed_lower) + " to " + pct(item.observed_upper),
          pct(item.lower) + " to " + pct(item.upper),
          item.estimate_lower === null ? "\u2014"
            : pct(item.estimate_lower) + " to " + pct(item.estimate_upper),
          item.eligibility
        ];
      })
    ));
    var warned = {};
    shown.forEach(function (item) {
      (item.warnings || []).forEach(function (text) {
        var target = item.node_id.replace(/^slice:/, "");
        var targets = warned[text] = warned[text] || [];
        if (targets.indexOf(target) < 0) targets.push(target);
      });
    });
    Object.keys(warned).forEach(function (text) {
      root.appendChild(el("div", { class: "diag WARNING" }, [
        el("div", { class: "code", text: "WARNING · " + warned[text].join(", ") }),
        el("div", { text: text })
      ]));
    });
    root.appendChild(el("p", { class: "sub", text:
      "The corrected band is normally wider, because uncertainty about the judge is real " +
      "uncertainty being added. The corrected estimate is normally lower, because false " +
      "positives are being removed -- which is why the calibration belongs in the frozen " +
      "plan, declared before any results are seen." }));
  }

  // ---- hierarchy ----------------------------------------------------------
  root.appendChild(section("Hierarchy"));
  var nodes = data.nodes || [];
  var byId = {};
  nodes.forEach(function (node) { byId[node.node_id] = node; });
  var maxUpper = 0;
  nodes.forEach(function (node) { if (node.upper > maxUpper) maxUpper = node.upper; });

  var children = {};
  var allIds = nodes.map(function (n) { return n.node_id; })
    .concat(data.unsampled_nodes || []);
  allIds.forEach(function (id) {
    var cut = id.lastIndexOf("|");
    if (cut < 0) return;
    var parent = id.slice(0, cut);
    (children[parent] = children[parent] || []).push(id);
  });
  Object.keys(children).forEach(function (key) { children[key].sort(); });

  function label(id) {
    var cut = id.lastIndexOf("|");
    return cut < 0 ? id : id.slice(cut + 1);
  }
  function rowFor(id) {
    var node = byId[id];
    if (!node) {
      return el("div", { class: "row unsampled" }, [
        el("span", { class: "name", text: label(id) }),
        el("span", { class: "n", text: "—" }),
        el("span", { class: "n", text: "0" }),
        el("span", { class: "b", text: "—" }),
        el("span", { class: "b", text: "no draws" })
      ]);
    }
    var bar = el("div", { class: "bar" });
    bar.style.width = maxUpper > 0 ? (100 * node.upper / maxUpper).toFixed(1) + "%" : "0";
    return el("div", { class: "row" }, [
      el("span", { class: "name", text: label(id) }),
      el("span", { class: "n", text: pct(node.node_weight, 2) }),
      el("span", { class: "n", text: String(node.draws) }),
      el("span", { class: "b", text: pct(node.estimate) }),
      el("span", null, [el("div", { class: "b", text: pct(node.upper) }), bar])
    ]);
  }
  function render(id, depth) {
    var kids = children[id];
    if (!kids || !kids.length) return el("div", { class: "leaf" }, [rowFor(id)]);
    var details = el("details", depth < 2 ? { open: "open" } : null, [
      el("summary", null, [rowFor(id)])
    ]);
    kids.forEach(function (child) { details.appendChild(render(child, depth + 1)); });
    return details;
  }
  var rootId = (nodes[0] || {}).node_id || "all";
  nodes.forEach(function (node) {
    if (node.node_id.indexOf("|") < 0) rootId = node.node_id;
  });
  root.appendChild(el("div", { class: "row", style: "color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;padding-bottom:.3rem;border-bottom:1px solid var(--line)" }, [
    el("span", { class: "name", text: "Node" }),
    el("span", { class: "n", text: "Weight" }),
    el("span", { class: "n", text: "Draws" }),
    el("span", { class: "b", text: "Estimate" }),
    el("span", { class: "b", text: "Upper" })
  ]));
  root.appendChild(el("div", { class: "tree" }, [render(rootId, 0)]));

  // ---- design sensitivity -------------------------------------------------
  var reweightings = data.design_sensitivity || [];
  if (reweightings.length) {
    root.appendChild(section("Sensitivity to the declared design"));
    root.appendChild(el("p", { class: "sub", text:
      "Design weights are a judgement, not a measurement. These re-estimate the root from " +
      "the same draws under alternative mixes declared in the frozen plan. They are " +
      "diagnostics: the draws were allocated for the declared design, so reweighting them " +
      "is importance sampling and the interval widens." }));
    root.appendChild(table(
      [{ label: "Alternative" }, { label: "Level" }, { label: "Estimate", num: true },
       { label: "Upper", num: true }, { label: "Declared upper", num: true },
       { label: "ESS", num: true }],
      reweightings.map(function (item) {
        return [item.id, item.level, pct(item.estimate), pct(item.upper),
                pct(item.declared_upper), item.effective_sample_size.toFixed(1)];
      })
    ));
  }

  // ---- rewrite acceptance -------------------------------------------------
  var acceptance = data.acceptance || [];
  var strained = acceptance.filter(function (row) { return row.exhaustion_rate > 0; });
  if (strained.length) {
    root.appendChild(section("Rewrite acceptance"));
    root.appendChild(el("p", { class: "sub", text:
      "The estimand is defined against the distribution the complete rewrite procedure " +
      "induces, retries and rejections included. Where the kernel struggles on one arm and " +
      "not another, the accepted prompts are shaped differently across the design." }));
    root.appendChild(table(
      [{ label: "Level" }, { label: "Value" }, { label: "Units", num: true },
       { label: "Accepted", num: true }, { label: "Exhausted", num: true },
       { label: "Mean attempts", num: true }],
      strained.map(function (row) {
        return [row.level, row.value, String(row.units), String(row.accepted),
                pct(row.exhaustion_rate, 1), row.mean_attempts.toFixed(2)];
      })
    ));
  }

  // ---- diagnostics --------------------------------------------------------
  root.appendChild(section("Diagnostics"));
  var diagnostics = data.diagnostics || [];
  if (!diagnostics.length) {
    root.appendChild(el("p", { class: "empty", text: "Nothing was reported." }));
  } else {
    diagnostics.forEach(function (item) {
      root.appendChild(el("div", { class: "diag " + item.severity }, [
        el("div", { class: "code", text: item.severity + " · " + item.code }),
        el("div", { text: item.message }),
        item.scope ? el("div", { class: "mono", text: item.scope }) : null
      ]));
    });
  }

  // ---- provenance ---------------------------------------------------------
  root.appendChild(section("Provenance"));
  var meta = el("dl", { class: "meta" });
  [["Plan SHA-256", evaluation.plan_sha256],
   ["Taxonomy fingerprint", evaluation.taxonomy_fingerprint],
   ["Kernel SHA-256", evaluation.kernel_sha256],
   ["Primary cohort", evaluation.primary_cohort],
   ["Selection seed", design.selection_seed],
   ["Proposal", design.proposal_id],
   ["Coverage", "alpha " + coverage.alpha + ", " + coverage.mode +
     (coverage.simultaneous_tree ? ", simultaneous across the tree" : ", nodes pointwise")],
   ["Package version", data.package_version]
  ].forEach(function (pair) {
    if (pair[1] === undefined || pair[1] === null) return;
    meta.appendChild(el("dt", { text: pair[0] }));
    meta.appendChild(el("dd", { class: "mono", text: String(pair[1]) }));
  });
  root.appendChild(meta);

  root.appendChild(el("footer", null, [
    el("div", { text: data.estimand || "" }),
    el("div", { text: "Two runs may only be pooled if their taxonomy and kernel fingerprints match." })
  ]));
})();
</script>
</body>
</html>

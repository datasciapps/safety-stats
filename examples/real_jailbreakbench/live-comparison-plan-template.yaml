schema_version: "2.0"

analysis:
  id: replaced-by-runner
  title: JailbreakBench-100 model comparison
  description: >-
    Fixed-design comparison over all 100 harmful JBB-Behaviors. Statistical intervals quantify
    repeated-rollout uncertainty for this declared design and do not treat behaviors as a random
    sample from a larger prompt population.
  intent: confirmatory
  plan_frozen_at: 2000-01-01T00:00:00Z

inputs:
  design_manifest: design.csv
  estimand: end_to_end_system
  score:
    name: jbb_harmful_compliance
    mapping:
      failure_values: ["FAIL"]
      safe_values: ["PASS"]
    missing: conservative_bounds
    errors: end_to_end

design:
  type: fixed
  hierarchy: [category_id, prompt_id]
  rollout_key: [eval_id, id, epoch]
  require_complete_manifest: true
  require_expected_rollouts: true
  weights:
    strategy: nested_equal
    hierarchy: [category_id, prompt_id]
  independence_profiles:
    rollout:
      block_by: [rollout]
      comparison_coupling: independent
    prompt:
      block_by: [prompt_id]
      comparison_coupling: joint
    category:
      block_by: [category_id]
      comparison_coupling: joint

cohorts:
  reference:
    match: {model: replaced-reference-model}
    require_uniform: [task_version, model_generate_config, solver]
  candidate_a:
    match: {model: replaced-candidate-a-model}
    require_uniform: [task_version, model_generate_config, solver]
  candidate_b:
    match: {model: replaced-candidate-b-model}
    require_uniform: [task_version, model_generate_config, solver]

groups:
  - id: all
    title: All 100 harmful JBB behaviors, category-balanced
    filter: {}
    weights:
      strategy: nested_equal
      hierarchy: [category_id, prompt_id]

outputs:
  prompt_bounds:
    enabled: true
    simultaneous: true
    family: displayed_prompt_bounds
    coverage_mode: two_sided
    alpha_allocation: equal_bonferroni
  direct_mean_intervals:
    enabled: true
    method: weighted_kl_chernoff
    reference_methods: [weighted_empirical_bernstein, weighted_hoeffding]
    family: displayed_direct_means
    groups: [all]
    simultaneous: true
    coverage_mode: two_sided
    independence:
      primary: rollout
      sensitivities: [prompt, category]
    hierarchy_nodes: true
    hierarchy_calibration: frontier_sidak
    hierarchy_region: linear_program
  joint_tree_intervals:
    enabled: true
    include_one_sided_upper: true
    family: model_comparisons
    groups: [all]
    independence_profile: rollout
    include_comparisons: true
    replicates: 5000
    seed: 1729
  risk_measures:
    - {id: mean, type: weighted_mean}
    - {id: cvar_90, type: cvar, beta: 0.90}
    - {id: entropic_10, type: entropic, lambda: 10}
    - {id: worst, type: maximum}

comparison_sets:
  - id: models_vs_reference
    cohorts: [reference, candidate_a, candidate_b]
    contrasts:
      type: versus_reference
      reference: reference
    estimands: [risk_difference, risk_ratio, relative_risk_reduction]
    group: all
    measure: mean
    method: weighted_kl_chernoff
    reference_methods: [weighted_empirical_bernstein, weighted_hoeffding]
    family: model_comparisons
    coverage_mode: two_sided
    independence:
      primary: rollout
      sensitivities: [prompt, category]
    hierarchy_nodes: true
    hierarchy_calibration: frontier_sidak
    hierarchy_region: linear_program

multiplicity:
  families:
    - id: displayed_prompt_bounds
      purpose: simultaneous_intervals
      method: bonferroni
      alpha: 0.05
    - id: displayed_direct_means
      purpose: simultaneous_intervals
      method: bonferroni
      alpha: 0.05
    - id: model_comparisons
      purpose: simultaneous_intervals
      method: bonferroni
      alpha: 0.05

claims: []

policy:
  zero_tolerance: {enabled: false}

report:
  include_decisions: false
  include_prompt_text: false
  include_observations: true
  decimal_places: 6

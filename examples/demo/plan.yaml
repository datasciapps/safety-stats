# Generated by `inspect-safety-stats init` on 2026-11-17 17:19 UTC.
# Review the score mapping, cohorts and weights before running `analyze`.
# Exploratory by construction: a confirmatory plan must be frozen before the
# evaluation runs (set analysis.intent and analysis.plan_frozen_at).
#
# Zero tolerance is off (policy.zero_tolerance.enabled: false): design.csv has no
# zero_tolerance column, so the gate would hold no prompt. To hold prompts to zero
# tolerance, add a zero_tolerance column, true for those prompts, and set enabled: true.
#
# Each multiplicity family (prompt_bounds, risk, comparisons) spends alpha 0.05 on its
# own: the intervals of one family hold together with probability at least 0.95, and all
# of the plan's intervals hold together with probability at least 0.85. To make them all
# hold together with a stated probability, split alpha between the families
# (multiplicity.families).
#
# The choices init made, and the assumptions they rest on (from
# inspect_safety_stats.registry):
#
# - rollout_independence: The primary independence profile is rollout, with prompt as a
#   sensitivity: every rollout is its own block, and the prompt profile, which blocks the
#   rollouts of a prompt together, is reported beside it.
#   Assumes: The blocks of the declared independence profile are independent: under the rollout
#   profile, every rollout of a prompt is an independent draw.
#   If wrong: Rollouts that share a cause, such as a retried request, a cache or a shared
#   conversation, make the bounds narrower than their stated coverage.
#   Remedy: Declare an independence profile that blocks the rollouts by what they share, and add
#   coarser profiles as sensitivities.
#
# - arm_independence: Under the rollout profile the models are compared as independent arms
#   (comparison_coupling: independent); the prompt sensitivity couples them
#   (comparison_coupling: joint).
#   Assumes: The arms of a comparison are independent of each other, block by block, unless the
#   profile couples them.
#   If wrong: Arms that share prompts' randomness, such as the same sampled conversation, make
#   the comparison's bounds miss their stated coverage.
#   Remedy: Set comparison_coupling: joint on a profile whose blocks span both arms.
#
# - plan_fixed_in_advance: analysis.intent is exploratory, because init writes the plan after
#   the logs exist.
#   Assumes: The plan was fixed before the runs started, so that no choice in it was made after
#   seeing the outcomes.
#   If wrong: Choices made after seeing outcomes can select the result, and the stated coverage
#   no longer holds.
#   Remedy: Freeze the plan before the runs, state analysis.plan_frozen_at, register its hash
#   and pass the receipt with --registration-receipt; otherwise set analysis.intent:
#   exploratory.
#
# - fixed_design: design.type is fixed: the bounds cover the 12 prompts of design.csv.
#   Assumes: Prompt, question, task and group membership are fixed, creator-declared design
#   elements. The bounds cover these prompts, not a population they were drawn from.
#   If wrong: A result read as covering prompts beyond the manifest overstates what the bounds
#   say about them.
#   Remedy: When the prompts are a probability sample of a larger set, declare design.type:
#   sampled with each prompt's inclusion probability.
#
# - run_stability: Each model is one cohort, which must be uniform in task_version,
#   model_generate_config, solver (require_uniform).
#   Assumes: Every rollout of a cohort comes from one stable system: the same model and
#   configuration throughout its runs.
#   If wrong: The bounds describe a mixture of configurations, not the system the cohort names.
#   Remedy: List the configuration fields that must not vary in the cohort's require_uniform,
#   and analyse configurations as separate cohorts.
#
# - complete_design: Every prompt expects 20 rollouts per model (expected_rollouts), and
#   design.require_expected_rollouts is left out, so it takes its default, true.
#   Assumes: Every run finished, every prompt of a fixed design was evaluated, and every prompt
#   has the rollouts the manifest expects.
#   If wrong: Prompts or rollouts that are missing for a reason linked to their outcome bias the
#   rates.
#   Remedy: Rerun the missing prompts and rollouts.
#
# - scorer_validity: The score 'safety_failure' is taken as the safety score, with failure
#   values ['FAIL'], safe values ['PASS'].
#   Assumes: The score measures the hazard. Scorer errors, under-elicitation, evaluation
#   awareness and omitted hazards are not repaired by statistical precision.
#   If wrong: The bounds are precise about the wrong quantity: a narrow bound on a score that
#   misses the hazard says nothing about the hazard.
#   Remedy: Validate the scorer on labelled rollouts, and declare judges with
#   inputs.judge_calibration to correct for their error.
#
# - judge_accuracy: inputs.judge_calibration is left out, so the score's verdicts are taken as
#   correct, as under its mode's default, assumed.
#   Assumes: Judge verdicts are taken as correct unless the plan validates or transports the
#   judge's error rates.
#   If wrong: Judge errors bias every rate and comparison the judge's verdicts enter.
#   Remedy: Label a validation sample and set inputs.judge_calibration.mode: validated, or
#   transported with a published validation set.
#
# - missing_scores: inputs.score.missing is left out, so it takes its default,
#   conservative_bounds.
#   Assumes: A rollout without a score has an unknown outcome, bounded at both extremes, unless
#   the plan counts it otherwise.
#   If wrong: Under exclude or count_as_failure, missing scores that are not missing at random
#   bias the rates.
#   Remedy: Rescore the missing rollouts, or keep score.missing: conservative_bounds so the
#   bounds cover every outcome they could have had.
#
# - sample_errors: inputs.score.errors is left out, so it takes its default, end_to_end.
#   Assumes: A sample error counts as the plan's score.errors says. Under end_to_end, with the
#   end-to-end system estimand, a provider's policy block of the target's generation that
#   delivered no content counts as safe.
#   If wrong: When errors come from the harness rather than the system, counting them as
#   outcomes biases the rates.
#   Remedy: Rerun the errored samples, or choose the score.errors policy that matches where the
#   errors come from.
#
# - token_limit: inputs.score.token_limit is left out, so it takes its default, score.
#   Assumes: An answer that stopped at the generation token limit counts by its score, and
#   without a score as missing.
#   If wrong: A truncated answer may have turned harmful or safe had it continued; its score
#   describes the truncation.
#   Remedy: Raise the token limit and rerun, or classify truncated answers with
#   score.token_limit.
#
# - content_filter_stops: inputs.score.content_filter_stops is left out, so it takes its
#   default, score.
#   Assumes: An output a provider's content filter stopped without a sample error counts by its
#   score.
#   If wrong: A stop that the scorer reads as a refusal or a failure counts as the model's
#   behaviour, though the provider's filter produced it.
#   Remedy: Classify the stops with score.content_filter_stops: safe or failure, under the
#   end-to-end estimand.

schema_version: '2.0'
analysis:
  id: refusal_demo-20261117T171929Z
  title: 'refusal_demo: mockllm/baseline, mockllm/candidate'
  description: 'Starter plan generated by inspect-safety-stats init. Exploratory:
    it was written after the logs existed.'
  intent: exploratory
inputs:
  design_manifest: design.csv
  score:
    name: safety_failure
    mapping:
      failure_values:
      - FAIL
      safe_values:
      - PASS
design:
  type: fixed
  hierarchy:
  - risk_domain
  - prompt_id
  weights:
    strategy: equal_prompt
    hierarchy:
    - risk_domain
    - prompt_id
  independence_profiles:
    rollout:
      block_by:
      - rollout
      comparison_coupling: independent
    prompt:
      block_by:
      - prompt_id
      comparison_coupling: joint
cohorts:
  baseline:
    match:
      model: mockllm/baseline
    require_uniform:
    - task_version
    - model_generate_config
    - solver
  candidate:
    match:
      model: mockllm/candidate
    require_uniform:
    - task_version
    - model_generate_config
    - solver
groups:
- id: all
  title: All prompts
  filter: {}
outputs:
  prompt_bounds:
    enabled: true
    simultaneous: true
    family: prompt_bounds
  direct_mean_intervals:
    enabled: true
    method: weighted_kl_chernoff
    family: risk
    independence:
      primary: rollout
      sensitivities:
      - prompt
    hierarchy_nodes: true
    hierarchy_calibration: frontier_sidak
  risk_measures:
  - id: mean
    type: weighted_mean
  # Added after init: the mean of the worst 10% of prompts, and the worst prompt. Both are
  # built from the per-prompt bounds, so at 20 rollouts per prompt they stay wide, and the
  # report says so in a TAIL_MEASURES_UNINFORMATIVE warning.
  - id: cvar_90
    type: cvar
    beta: 0.9
  - id: worst
    type: maximum
multiplicity:
  families:
  - id: prompt_bounds
    purpose: simultaneous_intervals
    method: bonferroni
    alpha: 0.05
  - id: risk
    purpose: simultaneous_intervals
    method: bonferroni
    alpha: 0.05
  - id: comparisons
    purpose: simultaneous_intervals
    method: bonferroni
    alpha: 0.05
claims: []
comparison_sets:
- id: models
  cohorts:
  - baseline
  - candidate
  contrasts:
    type: versus_reference
    reference: baseline
  estimands:
  - risk_difference
  - risk_ratio
  group: all
  measure: mean
  method: weighted_kl_chernoff
  family: comparisons
  independence:
    primary: rollout
    sensitivities:
    - prompt
  hierarchy_nodes: true
  hierarchy_calibration: frontier_sidak
policy:
  zero_tolerance:
    enabled: false
    manifest_field: zero_tolerance

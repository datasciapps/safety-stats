schema_version: "2.0"

certification:
  id: fixed-design-example-certification
  title: Fixed-design example statistical certification
  description: Example only; replace thresholds and the optional empirical plan hash.

source: {}

claims:
  - id: overall-mean-risk
    title: Overall fixed-design mean failure risk is at most 10%
    target:
      type: group_mean
      cohort: candidate
      group: all
    threshold: 0.10
    support:
      family: certification-support
      method: weighted_empirical_bernstein
      independence_profile: rollout
    rejection:
      enabled: true
      family: certification-rejection
      method: weighted_empirical_bernstein
      independence_profile: rollout
    sensitivity:
      - method: weighted_hoeffding
        independence_profile: rollout
      - method: weighted_empirical_bernstein
        independence_profile: prompt

  - id: task-mean-risk
    title: Each task's fixed-design mean failure risk is at most 20%
    target:
      type: hierarchy_mean
      cohort: candidate
      group: all
      level: task_id
      all_paths: true
    threshold: 0.20
    support:
      family: certification-support
      method: weighted_empirical_bernstein
      independence_profile: rollout
    rejection:
      enabled: true
      family: certification-rejection
      method: weighted_empirical_bernstein
      independence_profile: rollout

multiplicity:
  families:
    - id: certification-support
      purpose: simultaneous_support
      method: bonferroni
      alpha: 0.05
    - id: certification-rejection
      purpose: simultaneous_rejection
      method: bonferroni
      alpha: 0.05

report:
  decimal_places: 6
  detectable_power: 0.90

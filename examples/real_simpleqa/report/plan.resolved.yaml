analysis:
  description: Worked mechanics example using genuine Inspect outputs from GPT-4o.
    Incorrect answers are treated as failures. This is a reliability example, not
    evidence of deployment safety.
  id: real-simpleqa-eight
  intent: confirmatory
  plan_frozen_at: '2026-08-18T08:00:00Z'
  registration: null
  title: Eight real SimpleQA items as a fixed-design failure analysis
claims:
- acceptable_upper: 0.25
  cohort: candidate
  comparison: null
  family: decision_gate
  group: all-eight
  id: mean_failure_risk
  mandatory: true
  measure: mean
  method: corrected_interval
  title: Equal-weight fixed-design mean failure risk is acceptable
  unacceptable_lower: 0.6
cohorts:
  candidate:
    match:
      model: openai/gpt-4o
    require_uniform:
    - task_version
    - model_generate_config
    - solver
comparison_sets: []
comparisons: []
design:
  hierarchy:
  - task_id
  - question_id
  - prompt_id
  inclusion_probability_column: null
  independence_profiles:
    rollout:
      block_by:
      - rollout
      comparison_coupling: independent
  require_complete_manifest: true
  require_expected_rollouts: true
  rollout_key:
  - eval_id
  - id
  - epoch
  sampling: poisson
  stratum_column: null
  type: fixed
  weights:
    column: null
    hierarchy:
    - task_id
    - question_id
    - prompt_id
    strategy: equal_prompt
groups:
- filter: {}
  id: all-eight
  title: All eight fixed SimpleQA items
  weights:
    column: null
    hierarchy:
    - task_id
    - question_id
    - prompt_id
    strategy: equal_prompt
inputs:
  composites: []
  design_manifest: design.csv
  estimand: end_to_end_system
  judge_calibration: null
  judges: []
  sample_join:
    inspect_field: id
    manifest_field: prompt_id
  score:
    errors: block
    mapping:
      failure_if: null
      failure_values:
      - I
      safe_values:
      - C
    missing: block
    name: model_graded_qa
multiplicity:
  families:
  - alpha: 0.05
    id: displayed_prompt_bounds
    method: bonferroni
    purpose: simultaneous_intervals
  - alpha: 0.05
    id: displayed_direct_means
    method: bonferroni
    purpose: simultaneous_intervals
  - alpha: 0.05
    id: decision_gate
    method: intersection_union
    purpose: all_mandatory
outputs:
  direct_mean_intervals:
    coverage_mode: two_sided
    enabled: true
    family: displayed_direct_means
    groups:
    - all-eight
    hierarchy_calibration: frontier_sidak
    hierarchy_nodes: true
    hierarchy_region: linear_program
    independence:
      primary: rollout
      sensitivities: []
    method: weighted_kl_chernoff
    reference_methods:
    - weighted_empirical_bernstein
    - weighted_hoeffding
    simultaneous: true
  prompt_bounds:
    alpha_allocation: equal_bonferroni
    coverage_mode: two_sided
    enabled: true
    explicit_alpha: null
    family: displayed_prompt_bounds
    simultaneous: true
  risk_measures:
  - beta: null
    diagnostic_only: false
    id: mean
    k: null
    lambda: null
    threshold: null
    threshold_column: null
    type: weighted_mean
  - beta: 0.75
    diagnostic_only: false
    id: cvar_75
    k: null
    lambda: null
    threshold: null
    threshold_column: null
    type: cvar
  - beta: null
    diagnostic_only: false
    id: entropic_5
    k: null
    lambda: 5.0
    threshold: null
    threshold_column: null
    type: entropic
  - beta: null
    diagnostic_only: false
    id: worst
    k: null
    lambda: null
    threshold: null
    threshold_column: null
    type: maximum
policy:
  data_quality_failure: inconclusive
  zero_tolerance:
    enabled: false
    manifest_field: zero_tolerance
report:
  decimal_places: 6
  include_decisions: false
  include_observations: true
  include_prompt_text: false
schema_version: '2.0'

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so that new releases of unpinned dependencies (inspect-ai above all) that break
  # the package are noticed before users hit them, and so that the macOS leg runs at least
  # once a week.
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples research scripts

  types:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # tool.mypy pins python_version 3.12; running it once is enough.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: mypy src/inspect_safety_stats

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    # Runner minutes on this private repository are the owner's. A push to main is a merge
    # whose tree its pull request already tested on this whole matrix, so it runs the single
    # smoke job below instead. The weekly and manual runs still run everything.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every version the package claims to support. The development
        # environment is 3.12, so the older two are only ever exercised here.
        python-version: ["3.11", "3.12", "3.13"]
        # Windows on one Python version: path, encoding and line-ending problems are
        # platform-specific, not version-specific.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: pytest -ra

  test-main:
    name: pytest (ubuntu-latest, 3.12, after merge)
    # A smoke run for a push to main. The full matrix ran on the pull request's tree.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: pytest -ra

  test-macos:
    name: pytest (macos-latest, 3.12)
    # macOS runner minutes cost ten times Linux minutes on private repositories, so this leg
    # runs weekly and on demand only. Run it on a branch with
    # "gh workflow run CI --ref <branch>" when a change is platform-sensitive.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: pytest -ra

  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build
      - run: python -m build
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --quiet dist/*.whl
          # The wheel must carry both HTML report templates, not just the modules.
          /tmp/check/bin/python -c "
          import inspect_safety_stats
          from inspect_safety_stats.report import visualization
          from inspect_safety_stats.generative import visualization as generative
          print('version', inspect_safety_stats.__version__)
          assert visualization._TEMPLATE.is_file(), 'report template missing from wheel'
          assert generative._TEMPLATE.is_file(), 'generative template missing from wheel'
          "
          # Reading Inspect logs must work from a clean install, not only from a dev
          # environment that happens to have inspect-ai's optional extras.
          /tmp/check/bin/python -c "
          from inspect_ai.analysis import evals_df, samples_df
          import inspect_safety_stats.ingest.inspect_logs
          import inspect_safety_stats.generative.logs
          import pyarrow
          print('log ingestion importable, pyarrow', pyarrow.__version__)
          "
          /tmp/check/bin/inspect-safety-stats version
          /tmp/check/bin/inspect-safety-stats plan zero-failure --threshold 0.01 --alpha 0.05
          /tmp/check/bin/inspect-safety-stats generative --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

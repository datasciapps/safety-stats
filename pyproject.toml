[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "safety-stats"
version = "0.16.0"
description = "Confidence intervals, model comparisons, rollout planning and LLM-judge correction for pass/fail LLM evaluations, from Inspect AI logs or any harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Safety Stats contributors" }]
keywords = [
  "inspect-ai",
  "ai-safety",
  "statistics",
  "evaluation",
  "llm-evaluation",
  "benchmarks",
  "confidence-intervals",
  "clopper-pearson",
  "model-comparison",
  "sample-size",
  "power-analysis",
  "llm-as-a-judge",
  "judge-calibration",
  "red-teaming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Each floor is the lowest version the test suite passes with, at uv's lowest-direct resolution
# with NumPy 1 and with NumPy 2. Below them: SciPy's betaincinv, which gives the bound
# endpoints, is inaccurate at extreme quantiles before 1.12; pandas cannot deduplicate the
# Arrow-backed columns of Inspect's log reader before 2.2; and typer 0.17.4 and older, under
# click 8.2 or later, crash on a mistyped option and stop enforcing required options.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "typer>=0.17.5",
]

[project.urls]
Homepage = "https://github.com/aduncan001/safety_stats"
Repository = "https://github.com/aduncan001/safety_stats"
Issues = "https://github.com/aduncan001/safety_stats/issues"

[project.optional-dependencies]
# Reading Inspect AI logs, with --logs or logs=. Rollout files need neither package.
inspect = [
  # Before 0.3.288 Inspect's log reader fills model_args with the base URL, and before 0.3.289
  # Inspect cannot run an evaluation beside agent-client-protocol 1.0. Logs written by older
  # Inspect versions are still read: see SOURCE_FORMAT in ingest/inspect_logs.py.
  "inspect-ai>=0.3.289,<0.4",
  # inspect_ai.analysis, which reads the logs, needs this and declares it only as one of its
  # own dev extras. 16 is the first built for NumPy 2; older ones install beside it and fail.
  "pyarrow>=16",
]
openai = [
  "openai>=1.0",
]
translation = [
  "sentencepiece>=0.2,<1",
  "torch>=2.2,<3",
  "transformers>=4.44,<6",
]
dev = [
  "safety-stats[inspect]",
  "hypothesis>=6.100",
  # Tests validate report.json against `safety-stats schema report`.
  "jsonschema>=4.18",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scipy-stubs>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
safety-stats = "safety_stats.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: takes a minute or more; deselect with -m \"not slow\" for a quick run",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["safety_stats"]

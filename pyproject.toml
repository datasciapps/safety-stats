[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "inspect-safety-stats"
version = "0.10.0"
description = "Fixed-design statistical risk analysis for Inspect AI safety evaluations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Inspect Safety Stats contributors" }]
keywords = ["inspect-ai", "ai-safety", "statistics", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "inspect-ai>=0.3.259,<0.4",
  "numpy>=1.26",
  "pandas>=2.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "typer>=0.12",
]

[project.optional-dependencies]
openai = [
  "openai>=1.0",
]
translation = [
  "sentencepiece>=0.2,<1",
  "torch>=2.2,<3",
  "transformers>=4.44,<6",
]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scipy-stubs>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
inspect-safety-stats = "inspect_safety_stats.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_safety_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inspect_safety_stats"]
